<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutoTeVe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="tuto-screen" class="phone-layout" hidden><h1>TutoTeVe</h1><p id="status" class="status" role="status">Introduce el código que muestra el TV.</p><label for="pairing-code">Código del TV</label><input id="pairing-code" class="pairing-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-describedby="status" /><button id="start-camera" class="primary-button" type="button">Iniciar cámara</button><button id="invite-family" class="primary-button" type="button" hidden>Invitar familiar</button><div id="invite-fallback" hidden><label for="invite-link">Enlace de invitación</label><input id="invite-link" readonly /><button id="copy-link" type="button">Copiar enlace</button></div><video id="guest-video" class="remote-video" autoplay playsinline aria-label="Vídeo del familiar"></video><video id="local-video" class="local-video" autoplay muted playsinline aria-label="Vista previa de cámara"></video><button id="end-call" type="button" hidden>Terminar llamada</button><pre id="debug" class="debug" hidden aria-live="polite"></pre></main>
    <main id="guest-screen" class="phone-layout" hidden><h1>Videollamada con Tuto</h1><p id="guest-status" class="status" role="status">Pulsa para entrar a la llamada.</p><button id="join-call" class="primary-button" type="button">Entrar a la llamada</button><p id="caption-notice" class="caption-notice" hidden>Subtítulos no disponibles en este navegador.</p><video id="tuto-video" class="remote-video" autoplay playsinline aria-label="Vídeo de Tuto"></video><video id="guest-local-video" class="local-video" autoplay muted playsinline aria-label="Tu cámara"></video><button id="guest-end-call" type="button" hidden>Terminar llamada</button><pre id="guest-debug" class="debug" hidden aria-live="polite"></pre></main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
