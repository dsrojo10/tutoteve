<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutoTeVe · TV</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="tv-body">
    <main class="tv-layout">
      <video id="remote-video" autoplay playsinline aria-label="Vídeo en vivo"></video>
      <div class="tv-panel">
        <p id="status" class="status" role="status">Creando sala temporal…</p>
        <p class="tv-code" aria-label="Código de emparejamiento"><span id="pairing-code">------</span></p>
        <button id="play-video" type="button">Activar reproducción</button>
        <button id="end-test" type="button">Terminar prueba</button>
      </div>
      <pre id="debug" class="debug" hidden aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/receiver.js"></script>
  </body>
</html>
